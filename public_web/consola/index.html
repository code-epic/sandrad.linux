  <style type="text/css">
    #loading-bg {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f4f7fb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .loading-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Contenedor del logo con respiración suave */
    .loading-logo {
      position: relative;
      margin-bottom: 24px;
      animation: floatSoft 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 20px rgba(115, 103, 240, 0.12));
    }

    /* Barra de progreso suave y elegante */
    .loading {
      position: relative;
      width: 180px;
      height: 3px;
      background-color: rgba(115, 103, 240, 0.1);
      border-radius: 3px;
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    .loading::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #7367f0 0%, #9e95f5 50%, #7367f0 100%);
      box-shadow: 0 0 8px rgba(115, 103, 240, 0.35);
      border-radius: 3px;
      animation: progressSoft 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .loading-text {
      margin-top: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11.5px;
      letter-spacing: 0.4px;
      color: #94a3b8;
      font-weight: 500;
      animation: pulseText 2s ease-in-out infinite;
    }

    @keyframes floatSoft {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.98;
      }
      50% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    @keyframes progressSoft {
      0% {
        left: -40%;
        width: 35%;
      }
      50% {
        left: 30%;
        width: 45%;
      }
      100% {
        left: 100%;
        width: 35%;
      }
    }

    @keyframes pulseText {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>

<body>
  <core-loading-screen id="loading-bg">
    <div class="loading-wrapper">
      <div class="loading-logo" id="loading-logo-container"></div>
      <div class="loading"></div>
      <div class="loading-text">Cargando entorno seguro...</div>
    </div>
  </core-loading-screen>
  <app-root> </app-root>

  <script>
    (function () {
      // Configuración de temas
      const config = {
        default: {
          logo: 'assets/images/logo/logo.png',
          title: 'Sandra Server',
          favicon: 'favicon.ico'
        },
        bdv: {
          keywords: ['sicoex', 'banv', 'corp'],
          logo: 'assets/images/logo/logo-bdv.png',
          title: 'BDV Server',
          favicon: 'assets/images/bdv/favicon.ico'
        }
      };

      const logoContainer = document.getElementById('loading-logo-container');
      if (!logoContainer) return;

      const url = window.location.href.toLowerCase();
      const isBdv = config.bdv.keywords.some(keyword => url.includes(keyword));
      const theme = isBdv ? config.bdv : config.default;

      // Actualizar UI
      window.document.title = theme.title;

      const link = document.querySelector("link[rel~='icon']");
      if (link) link.href = theme.favicon;

      const imgElement = new Image(200, 200);
      imgElement.src = theme.logo;
      imgElement.alt = 'Logo';
      logoContainer.appendChild(imgElement);

      window.addEventListener('message', (event) => {
        if (event.data.type === 'NETWORK_CONTEXT') {
          sessionStorage.setItem('net_info', JSON.stringify(event.data.payload));
        }
        if (event.data.type === 'SET_SESSION') {
          sessionStorage.setItem('token_sandra', event.data.token);
          // window.location.reload();
        }

      });

    })();
  </script>

  <!--
    NOTA: Los interceptores de consola/fetch/XHR se eliminaron porque:
    - Angular 22 usa FetchBackend (no XHR) para HttpClient
    - Los interceptores de console.log/error interferían con zone.js
      al agregar microtareas postMessage en cada llamada
    - En modo standalone (no Electron/Tauri), sendToParent() no tiene efecto útil
    - Si se necesita monitoreo en el futuro, reinstalar con .then() en vez de async/await
  -->
